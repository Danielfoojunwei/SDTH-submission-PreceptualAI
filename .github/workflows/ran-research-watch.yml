name: RAN research watch

on:
  schedule:
    - cron: '0 0 * * *' # Daily 08:00 Asia/Singapore, after default-branch merge.
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ran-research-watch.yml'
      - 'src/wirelessjev/research_watch.py'
      - 'scripts/update_ran_research.py'
      - 'scripts/verify_research_watch.py'
      - 'scripts/restore_research_watch.py'
      - 'tests/test_research_watch.py'
      - 'tests/test_research_workflow.py'
      - 'tests/test_research_restore.py'
  pull_request:
    paths:
      - '.github/workflows/ran-research-watch.yml'
      - 'src/wirelessjev/research_watch.py'
      - 'scripts/update_ran_research.py'
      - 'scripts/verify_research_watch.py'
      - 'scripts/restore_research_watch.py'
      - 'tests/test_research_watch.py'
      - 'tests/test_research_workflow.py'
      - 'tests/test_research_restore.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: ran-research-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified official ref
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install metadata-test dependency
        run: python -m pip install pytest==9.1.1
      - name: Validate discovery contracts without network
        run: python -m pytest tests/test_research_watch.py tests/test_research_workflow.py tests/test_research_restore.py -q
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: previous
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/ran-research-watch
          key: ran-watch-store-v1-${{ github.event.repository.default_branch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ran-watch-store-v1-${{ github.event.repository.default_branch }}-
      - name: Restore verified history or recover a durable workflow artifact
        id: restore
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/restore_research_watch.py
          --output-dir "$RUNNER_TEMP/ran-research-watch"
          --repository "${{ github.repository }}"
          --default-branch "${{ github.event.repository.default_branch }}"
          --run-id "${{ github.run_id }}"
      - name: Discover unreviewed leads from official providers
        id: refresh
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: >-
          python scripts/update_ran_research.py
          --output-dir "$RUNNER_TEMP/ran-research-watch"
          --sources arxiv openalex --since 2026-01-01
          --max-results 5 --timeout 10 --max-attempts 2 --max-run-seconds 180
      - name: Verify snapshot and provider response hashes
        id: verify
        if: always() && github.event_name != 'pull_request' && steps.restore.outcome == 'success'
        run: python scripts/verify_research_watch.py --output-dir "$RUNNER_TEMP/ran-research-watch"
      - name: Retain complete and degraded discovery evidence
        id: durable
        if: always() && github.event_name != 'pull_request' && steps.verify.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ran-research-watch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ran-research-watch
          if-no-files-found: error
          retention-days: 90
      - name: Retain invalid-store diagnostics without publishing a recovery snapshot
        if: always() && github.event_name != 'pull_request' && steps.verify.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ran-watch-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ran-research-watch
          if-no-files-found: warn
          retention-days: 14
      - name: Cache history only after durable artifact upload
        if: always() && steps.verify.outcome == 'success' && steps.durable.outcome == 'success' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ran-research-watch
          key: ran-watch-store-v1-${{ github.event.repository.default_branch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Make degraded discovery visible after retaining evidence
        if: always() && github.event_name != 'pull_request' && steps.refresh.outcome != 'success'
        run: exit 1
