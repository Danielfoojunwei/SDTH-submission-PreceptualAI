name: software-verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-software:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install explicit build and verification dependencies
        run: python -m pip install 'setuptools>=68,<82' 'cryptography>=41,<47'
      - name: Install Kval without network-resolved runtime dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Verify every capability is reachable from production
        run: python scripts/verify_integration.py
      - name: Confirm LMS matches the RFC 8554 published test vector
        run: python -m unittest tests.test_pqc.Rfc8554KnownAnswerTests -v
        env:
          PYTHONPATH: src
      - name: Reject production simulation providers
        run: |
          if grep -RniE 'class (Mock|Fake|Simulated)|MockTelemetry|FakeTelemetry|SimulationBackend' src; then
            exit 1
          fi
      - name: Reject any transmit or electronic-attack path
        run: |
          if grep -RniE 'def (transmit|jam|start_jamming|set_tx_power|set_frequency|set_gain|emit_waveform)|"(jam|transmit)"|OFFENSIVE' src; then
            echo 'a transmit or electronic-attack path appeared in src' >&2
            exit 1
          fi
      - name: Confirm no lease action can transmit
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from kval_node.lease import LeaseAction
          forbidden = {"transmit", "jam", "set_tx_power", "set_frequency", "set_gain",
                       "revoke_credentials", "delete_audit", "rotate_trust_anchor"}
          actions = {item.value for item in LeaseAction}
          overlap = actions & forbidden
          if overlap:
              raise SystemExit(f"forbidden lease actions present: {sorted(overlap)}")
          print(f"{len(actions)} lease actions, none forbidden")
          PY
      - name: Confirm hardware gate fails off Jetson
        run: |
          if kval-node preflight; then
            echo 'preflight unexpectedly accepted a non-Jetson runner' >&2
            exit 1
          fi
