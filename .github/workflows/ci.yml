name: software-verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-software:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install explicit build and verification dependencies
        run: python -m pip install 'setuptools>=68,<82' 'cryptography>=41,<47'
      - name: Install Kval without network-resolved runtime dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Reject production simulation providers
        run: |
          if grep -RniE 'class (Mock|Fake|Simulated)|MockTelemetry|FakeTelemetry|SimulationBackend' src; then
            exit 1
          fi
      - name: Reject any transmit or electronic-attack path
        run: |
          if grep -RniE 'def (transmit|jam|start_jamming|set_tx_power|set_frequency|set_gain|emit_waveform)|"(jam|transmit)"|OFFENSIVE' src; then
            echo 'a transmit or electronic-attack path appeared in src' >&2
            exit 1
          fi
      - name: Confirm spectrum sensing stays receive-only
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from kval_node.spectrum import SpectrumObservation, SpectrumPolicy
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone.utc)
          base = {
              "policy_id": "ci", "region": "CI",
              "created_at": (now - timedelta(minutes=1)).isoformat(),
              "expires_at": (now + timedelta(days=1)).isoformat(),
              "bands": [{"band_id": "b", "label": "b", "freq_low_hz": 1_000_000,
                         "freq_high_hz": 2_000_000, "max_resolution_bandwidth_hz": 1000}],
          }
          try:
              SpectrumPolicy.from_dict({**base, "passive_only": False}, now=now)
          except ValueError:
              pass
          else:
              raise SystemExit("passive_only could be disabled")
          try:
              SpectrumObservation.from_dict({
                  "band_id": "b", "observed_at": now.isoformat(),
                  "source_adapter_id": "s", "conformance_hash": "a" * 64,
                  "passive": False, "occupancy_percent": 1.0, "noise_floor_dbm": -95.0})
          except ValueError:
              pass
          else:
              raise SystemExit("a non-passive observation was accepted")
          print("receive-only invariants hold")
          PY
      - name: Confirm no lease action can transmit
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from kval_node.lease import LeaseAction
          forbidden = {"transmit", "jam", "set_tx_power", "set_frequency", "set_gain",
                       "revoke_credentials", "delete_audit", "rotate_trust_anchor"}
          actions = {item.value for item in LeaseAction}
          overlap = actions & forbidden
          if overlap:
              raise SystemExit(f"forbidden lease actions present: {sorted(overlap)}")
          print(f"{len(actions)} lease actions, none forbidden")
          PY
      - name: Confirm hardware gate fails off Jetson
        run: |
          if kval-node preflight; then
            echo 'preflight unexpectedly accepted a non-Jetson runner' >&2
            exit 1
          fi
