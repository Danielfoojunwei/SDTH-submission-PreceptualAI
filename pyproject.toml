[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kval-spectravault-node"
version = "0.3.0"
description = "Policy-constrained adaptive connectivity and passive spectrum-sensing node for NVIDIA Jetson Orin Nano"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Preceptual.ai" }]
dependencies = []

[project.scripts]
kval-node = "kval_node.cli:main"
kval-spectrum-sensord = "kval_node.sensor_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
